name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK and write version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk "F1-Replays-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk F1-Replays.apk
          TAG=latest
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          SHA256=$(sha256sum F1-Replays.apk | cut -d' ' -f1)
          cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "0.1.${{ github.run_number }}",
            "apk": "https://github.com/${{ github.repository }}/releases/download/$TAG/F1-Replays-${{ github.run_number }}.apk",
            "sha256": "$SHA256",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat version.json
          ls -la *.apk version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1-Replays-apk
          path: F1-Replays-${{ github.run_number }}.apk

      - name: Publish "latest" release (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "F1 Replays – build ${{ github.run_number }}"
          NOTES: "Automated build of ${{ github.sha }}. Install F1-Replays.apk on your Shield / Fire TV."
        run: |
          # Move the "latest" tag to this commit; the release stays attached to the tag name, so the
          # download link keeps working while the release is updated in place.
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" version.json --clobber
            gh release edit latest --prerelease --title "$TITLE" --notes "$NOTES"
            # Drop numbered APKs from earlier builds.
            for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
              case "$asset" in
                F1-Replays.apk|F1-Replays-${{ github.run_number }}.apk) ;;
                F1-Replays-*.apk) gh release delete-asset latest "$asset" --yes ;;
              esac
            done
          else
            gh release create latest F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" version.json \
              --prerelease --title "$TITLE" --notes "$NOTES"
          fi

      - name: Publish tagged release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" version.json \
            --title "F1 Replays $TAG" --generate-notes \
            || gh release upload "$TAG" F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" version.json --clobber
