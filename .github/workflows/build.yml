name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "F1-Replays-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk F1-Replays.apk
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1-Replays-apk
          path: F1-Replays-${{ github.run_number }}.apk

      - name: Publish "latest" release (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" \
            --prerelease \
            --title "F1 Replays – build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}. Install F1-Replays.apk on your Shield / Fire TV."

      - name: Publish tagged release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" \
            --title "F1 Replays $TAG" --generate-notes \
            || gh release upload "$TAG" F1-Replays.apk "F1-Replays-${{ github.run_number }}.apk" --clobber
